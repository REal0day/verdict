services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: irs
      POSTGRES_PASSWORD: irs
      POSTGRES_DB: irs
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U irs"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    env_file: .env
    environment:
      IRS_DATABASE_URL: postgresql+psycopg://irs:irs@db:5432/irs
    ports:
      - "8000:8000"
    volumes:
      - irs_data:/data
    depends_on:
      db:
        condition: service_healthy
    # For production put this behind a TLS-terminating reverse proxy (Caddy/Traefik/nginx).

  # --- optional, enable when scaling summarization/chat to background workers ---
  # redis:
  #   image: redis:7
  # worker:
  #   build: ./server
  #   command: celery -A app.worker worker -l info
  #   env_file: .env
  #   depends_on: [db, redis]

volumes:
  pgdata:
  irs_data:
  imports_staging:
